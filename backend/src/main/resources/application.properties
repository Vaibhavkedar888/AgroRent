# =============================================
# Spring Boot Application Configuration
# =============================================

# Application Name
spring.application.name=farming-equipment-rental-system

# =============================================
# Server Configuration
# =============================================
server.port=${PORT:8080}
server.servlet.context-path=/

# =============================================
# Database Configuration (MongoDB)
# =============================================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/farming_rental_db}
spring.data.mongodb.database=${MONGODB_DATABASE:farming_rental_db}
# Note: auto-index-creation removed — it forces eager connection at startup
# which races against Atlas SRV DNS resolution and causes mongoTemplate bean failure

# =============================================
# Thymeleaf Configuration
# =============================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# =============================================
# Static Resources
# =============================================
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.chain.strategy.content.enabled=true

# =============================================
# File Upload Configuration
# =============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =============================================
# Razorpay Configuration (TEST MODE)
# =============================================
# Get these from https://dashboard.razorpay.com/
razorpay.key.id=rzp_test_your_key_id
razorpay.key.secret=rzp_test_your_key_secret

# =============================================
# Gmail SMTP Email Configuration
# =============================================
# Use a Gmail App Password (not your account password)
# How to get: Google Account → Security → 2-Step Verification → App Passwords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=agrorent649@gmail.com
spring.mail.password=${MAIL_PASSWORD:ikln dhjf tkoj przb}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# OTP Settings
otp.validity.minutes=10
otp.from.email=agrorent649@gmail.com
otp.from.name=AgroRent

# =============================================
# Logging Configuration
# =============================================
logging.level.root=INFO
logging.level.com.farming.rental=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/application.log

# =============================================
# Session Configuration
# =============================================
server.servlet.session.timeout=30m

# =============================================
# Encoding
# =============================================
# spring.mandatory-file-encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

# =============================================
# Error Handling
# =============================================
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
