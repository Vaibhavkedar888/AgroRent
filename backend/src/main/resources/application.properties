# =============================================
# Spring Boot Application Configuration
# =============================================

# Application Name
spring.application.name=farming-equipment-rental-system

# =============================================
# Server Configuration
# =============================================
server.port=8080
server.servlet.context-path=/

# Enable GZIP Compression for faster response
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# =============================================
# Database Configuration (MongoDB)
# =============================================
spring.data.mongodb.uri=mongodb://localhost:27017/farming_rental_db
spring.data.mongodb.auto-index-creation=true

# MongoDB Performance Tuning
spring.data.mongodb.min-connections-per-host=5
spring.data.mongodb.max-connections-per-host=100
spring.data.mongodb.threads-allowed-to-block-for-connection-multiplier=5

# Tomcat Performance Tuning
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

# =============================================
# Thymeleaf Configuration
# =============================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8

# =============================================
# Static Resources
# =============================================
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.chain.strategy.content.enabled=true

# =============================================
# File Upload Configuration
# =============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =============================================
# Razorpay Configuration (TEST MODE)
# =============================================
# Get these from https://dashboard.razorpay.com/
razorpay.key.id=rzp_test_your_key_id
razorpay.key.secret=rzp_test_your_key_secret

# =============================================
# Mail Configuration (SMTP)
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=agrorent649@gmail.com
spring.mail.password=ytuyncctcxrsyqvc
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =============================================
# Logging Configuration
# =============================================
logging.level.root=INFO
logging.level.com.farming.rental=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/application.log

# =============================================
# Session Configuration
# =============================================
server.servlet.session.timeout=30m

# =============================================
# Encoding
# =============================================
# spring.mandatory-file-encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

# =============================================
# Error Handling
# =============================================
server.error.include-message=always
server.error.include-stacktrace=on_param
server.error.include-exception=false
